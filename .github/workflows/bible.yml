name: Fetch Bible text (WEB)

# Runs once when this script lands in the repo (and whenever you edit it),
# or manually from the Actions tab. Writes data/bible/web/<book>/<chapter>.json.
on:
  workflow_dispatch: {}
  push:
    paths:
      - scripts/fetch_bible.py

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and split the World English Bible
        run: python scripts/fetch_bible.py
      - name: Commit
        run: |
          git config user.name "bible-bot"
          git config user.email "bible-bot@users.noreply.github.com"
          git add data/bible
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "chore: add World English Bible text (public domain)"
            git push
          fi
